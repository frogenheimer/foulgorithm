# Canonical team identities.
#
# Populated during M1 from the primary source's team list. Deliberately empty now:
# hard-coding a team list is exactly what broke the 2025 version every August.
#
# Structure:
#
# teams:
#   - id: nottingham-forest          # canonical, stable, kebab-case, never changes
#     name: Nottingham Forest
#     short_name: Forest
#     sources:
#       fbref: e4a775cb              # deterministic source key where one exists
#       api_football: 65
#     aliases:                       # every spelling seen in the wild
#       - Nott'ham Forest
#       - Nott'm Forest
#       - Nottingham Forest FC
#
# Rules:
#   - Canonical ids never change, even if a club is renamed. Add a new alias instead.
#   - Prefer deterministic source keys. Aliases are the fallback for sources without ids.
#   - A new team id is added by a human, never generated by a matcher.
#     See docs/decisions/ADR-007-identity-halts-pipeline.md

teams: []
