# Canonical player identities.
#
# Only needed where deterministic source ids are absent or where two sources disagree.
# Most players resolve on source id alone and never appear here.
#
# Structure:
#
# players:
#   - id: gabriel-magalhaes-1997        # canonical, includes birth year to disambiguate
#     full_name: Gabriel dos Santos Magalhães
#     display_name: Gabriel
#     birth_date: 1997-12-19
#     sources:
#       fbref: bc7dc64d
#       api_football: 22219
#     aliases:
#       - Gabriel Magalhães
#       - Gabriel dos Santos Magalhães
#       - Gabriel
#
# Rules:
#   - A name match alone NEVER resolves an identity. Confirm with birth date, club,
#     position and nationality. Two players with similar names at one club is not
#     hypothetical, and getting it wrong silently transfers one player's history to
#     another. See docs/decisions/ADR-007-identity-halts-pipeline.md
#   - Canonical ids are permanent. A transfer changes nothing here, because club
#     membership is a fact about an appearance, not about the player.
#   - Fuzzy matching proposes candidates into crosswalk_pending.yaml. A human confirms.

players: []

# Human-confirmed matches between the current squad list (legal names) and our
# foul history (common names).
#
# Everything here was refused by the automatic rules for being ambiguous, which
# is the correct behaviour: "David Raya Martín" matches both "David Martin" and
# "David Raya" on tokens alone, and guessing would transplant one player's foul
# rate onto another. A person settles it once, here, and it is reviewable in a
# diff forever after.
#
# Key is the FPL name, value is the name as it appears in the foul history.
aliases:
  David Raya Martín: David Raya
  Gabriel dos Santos Magalhães: Gabriel Magalhães
  Benjamin White: Ben White
  Emiliano Buendía Stati: Emiliano Buendía
  Rodrigo Hernandez: Rodri
  Bernardo Veiga de Carvalho e Silva: Bernardo Silva
  João Pedro Cavaco Cancelo: João Cancelo
  Matheus Santos Carneiro Da Cunha: Matheus Cunha
  Bruno Guimarães Rodriguez Moura: Bruno Guimarães
  Igor Julio dos Santos de Paulo: Igor
  # The league's season totals say "Andy"; our squads and claims say "Andrew".
  # Neither token rule can bridge a different forename, so it is settled here.
  Andrew Robertson: Andy Robertson
