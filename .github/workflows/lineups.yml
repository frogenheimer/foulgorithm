name: lineups

# Confirmed elevens are published at T-60. Catching that reliably is a timing
# problem, and cron is the wrong tool for it: a 30-minute cron catches T-60
# somewhere between T-60 and T-30, and GitHub's scheduler is documented as
# running late under load, sometimes by 15 minutes or more. Stacking those, a
# fixture could publish at T-15 or be missed. Tightening the interval does not
# help, because the jitter is in the scheduler rather than the interval.
#
# So cron only has to START the job roughly on time. Everything precise happens
# inside it: it works out when the next lineups are due, sleeps, then polls every
# minute until they land. One run covers a whole afternoon.
on:
  schedule:
    # Generated from the real fixture list by foulgorithm.jobs.schedule, which
    # runs weekly. One entry per distinct kickoff, bundled: five Saturday
    # three-o'clock fixtures publish their elevens at the same moment and need
    # one wake-up between them, not five.
    #
    # The backbone, independent of the generated block and of the weekly
    # reschedule that writes it: every two hours through the football day,
    # every day. The watcher exits in under a minute when nothing kicks off
    # in the next six hours and sleeps until T-65 when something does, so
    # this costs a runner minute a run and survives a missed reschedule or a
    # scheduler running two hours late (28 August 2026: the evening wake
    # never fired and the confirmed elevens were published by hand).
    - cron: "5 6,8,10,12,14,16,18,20 * * *"
    # Do not edit between the markers. Anything outside them survives.
    # BEGIN generated by foulgorithm.jobs.schedule
    # Fri 28 Aug 19:00 kickoff
    - cron: "0 15 28 8 *"
    # Sat 29 Aug 11:30 kickoff
    - cron: "30 7 29 8 *"
    # Sat 29 Aug 14:00 kickoff
    - cron: "0 10 29 8 *"
    # Sat 29 Aug 16:30 kickoff
    - cron: "30 12 29 8 *"
    # Sun 30 Aug 13:00 kickoff
    - cron: "0 9 30 8 *"
    # Sun 30 Aug 15:30 kickoff
    - cron: "30 11 30 8 *"
    # Mon 31 Aug 19:00 kickoff
    - cron: "0 15 31 8 *"
    # Fri 04 Sep 19:00 kickoff
    - cron: "0 15 4 9 *"
    # Sat 05 Sep 11:30 kickoff
    - cron: "30 7 5 9 *"
    # Sat 05 Sep 14:00 kickoff
    - cron: "0 10 5 9 *"
    # Sat 05 Sep 16:30 kickoff
    - cron: "30 12 5 9 *"
    # Sun 06 Sep 13:00 kickoff
    - cron: "0 9 6 9 *"
    # Sun 06 Sep 15:30 kickoff
    - cron: "30 11 6 9 *"
    # Tue 08 Sep 18:45 kickoff
    - cron: "45 14 8 9 *"
    # Wed 09 Sep 18:45 kickoff
    - cron: "45 14 9 9 *"
    # END generated
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if the lineups have not changed"
        type: boolean
        default: false

concurrency:
  group: lineups
  # Queue rather than cancel: a second window starting while the first is still
  # watching is continuous coverage, not a duplicate.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Watch for lineups
        id: watch
        # Exit 1 means nothing was due in this window, which is normal. Only
        # exit 2, a dead source, should fail the run and alert us.
        run: |
          set +e
          python -m foulgorithm.jobs.lineup_watch_live
          code=$?
          set -e
          if [ $code -eq 2 ]; then exit 1; fi
          echo "changed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.watch.outputs.changed == 'true'
        run: |
          git config user.name "foulgorithm-bot"
          git config user.email "foulgorithm@users.noreply.github.com"
          git add site/public/data data/state/lineups_seen.json data/state/positions_seen.json data/predictions data/slates data/picks
          git diff --cached --quiet && exit 0
          git commit -m "Confirmed lineups for this round"
          git pull --rebase --autostash
          git push

  # Cup ties, watched separately against the source that knows they exist.
  # See src/foulgorithm/jobs/cup_watch.py. Runs in parallel with the league
  # watch and exits within a minute on days with no cup fixture. Needs the
  # API_FOOTBALL_KEY repository secret.
  cup:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Watch for cup lineups
        id: watch
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set +e
          python -m foulgorithm.jobs.cup_watch
          code=$?
          set -e
          if [ $code -eq 2 ]; then exit 1; fi
          echo "changed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.watch.outputs.changed == 'true'
        run: |
          git config user.name "foulgorithm-bot"
          git config user.email "foulgorithm@users.noreply.github.com"
          git add site/public/data/cup.json site/public/data/fixtures data/state/cup_lineups_seen.json data/state/positions_seen.json data/state/expected_totals.json
          git diff --cached --quiet && exit 0
          git commit -m "Confirmed cup lineups"
          git pull --rebase --autostash
          git push
