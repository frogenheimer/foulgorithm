name: lineups

# Confirmed lineups land about an hour before kickoff, so this polls through the
# windows when Premier League matches actually kick off (all times UTC).
#
# It runs here rather than on the site because the site is a static export with
# no backend. There is no server for a button to call, and adding one would mean
# either paying for invocations or exposing an endpoint anyone could use to
# hammer the league's API on our behalf.
on:
  schedule:
    # Saturday and Sunday, 11:00 to 20:00
    - cron: "0,30 11-20 * * 6,0"
    # Friday and Monday evenings
    - cron: "0,30 18-21 * * 1,5"
    # Midweek rounds
    - cron: "0,30 18-21 * * 2,3,4"
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if the lineups have not changed"
        type: boolean
        default: false

concurrency:
  group: lineups
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Poll
        id: poll
        # Exit 1 means nothing changed, which is the common case and not a
        # failure. Only exit 2, a dead source, should fail the run and alert us.
        run: |
          set +e
          python -m foulgorithm.jobs.lineup_watch ${{ inputs.force && '--force' || '' }}
          code=$?
          set -e
          if [ $code -eq 2 ]; then exit 1; fi
          echo "changed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.poll.outputs.changed == 'true'
        run: |
          git config user.name "foulgorithm-bot"
          git config user.email "foulgorithm@users.noreply.github.com"
          git add site/public/data data/raw/lineups_seen.json data/predictions
          git diff --cached --quiet && exit 0
          git commit -m "Confirmed lineups for this round"
          git push
