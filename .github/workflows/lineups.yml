name: lineups

# Confirmed elevens are published at T-60. Catching that reliably is a timing
# problem, and cron is the wrong tool for it: a 30-minute cron catches T-60
# somewhere between T-60 and T-30, and GitHub's scheduler is documented as
# running late under load, sometimes by 15 minutes or more. Stacking those, a
# fixture could publish at T-15 or be missed. Tightening the interval does not
# help, because the jitter is in the scheduler rather than the interval.
#
# So cron only has to START the job roughly on time. Everything precise happens
# inside it: it works out when the next lineups are due, sleeps, then polls every
# minute until they land. One run covers a whole afternoon.
on:
  schedule:
    # Generated from the real fixture list by foulgorithm.jobs.schedule, which
    # runs weekly. One entry per distinct kickoff, bundled: five Saturday
    # three-o'clock fixtures publish their elevens at the same moment and need
    # one wake-up between them, not five.
    #
    # Do not edit between the markers. Anything outside them survives.
    # BEGIN generated by foulgorithm.jobs.schedule
    # Fri 28 Aug 19:00 kickoff
    - cron: "20 17 28 8 *"
    # Sat 29 Aug 11:30 kickoff
    - cron: "50 9 29 8 *"
    # Sat 29 Aug 14:00 kickoff
    - cron: "20 12 29 8 *"
    # Sat 29 Aug 16:30 kickoff
    - cron: "50 14 29 8 *"
    # Sun 30 Aug 13:00 kickoff
    - cron: "20 11 30 8 *"
    # Sun 30 Aug 15:30 kickoff
    - cron: "50 13 30 8 *"
    # Mon 31 Aug 19:00 kickoff
    - cron: "20 17 31 8 *"
    # Fri 04 Sep 19:00 kickoff
    - cron: "20 17 4 9 *"
    # Sat 05 Sep 11:30 kickoff
    - cron: "50 9 5 9 *"
    # Sat 05 Sep 14:00 kickoff
    - cron: "20 12 5 9 *"
    # Sat 05 Sep 16:30 kickoff
    - cron: "50 14 5 9 *"
    # Sun 06 Sep 13:00 kickoff
    - cron: "20 11 6 9 *"
    # Sun 06 Sep 15:30 kickoff
    - cron: "50 13 6 9 *"
    # END generated
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if the lineups have not changed"
        type: boolean
        default: false

concurrency:
  group: lineups
  # Queue rather than cancel: a second window starting while the first is still
  # watching is continuous coverage, not a duplicate.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Watch for lineups
        id: watch
        # Exit 1 means nothing was due in this window, which is normal. Only
        # exit 2, a dead source, should fail the run and alert us.
        run: |
          set +e
          python -m foulgorithm.jobs.lineup_watch_live
          code=$?
          set -e
          if [ $code -eq 2 ]; then exit 1; fi
          echo "changed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.watch.outputs.changed == 'true'
        run: |
          git config user.name "foulgorithm-bot"
          git config user.email "foulgorithm@users.noreply.github.com"
          git add site/public/data data/state data/predictions data/slates data/picks
          git diff --cached --quiet && exit 0
          git commit -m "Confirmed lineups for this round"
          git pull --rebase --autostash
          git push
