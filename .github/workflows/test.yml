name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs so pushes in quick succession do not burn the free minute allowance.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        # Network-marked tests are excluded: CI must not depend on a third party being up.
        run: pytest -q -m "not network"
