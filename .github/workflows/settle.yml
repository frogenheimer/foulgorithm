name: settle

# Grades what we published. Runs Monday morning, after the weekend settles, and
# again Thursday to catch midweek rounds.
#
# This is the whole credibility of the project. Publishing predictions without
# grading them is what a tipster account does, and the bad weeks are the point.
#
# The Monday and Thursday entries are backstops. The generated block below adds
# one wake per matchday, a few hours after its last kickoff, written by the
# weekly reschedule job from the real fixture list. Narrower windows mean fewer
# players featuring twice between snapshots, which is the data that was being
# lost. See docs/33-settle-schedule.md.
on:
  schedule:
    - cron: "0 9 * * 1"
    - cron: "0 9 * * 4"
    # BEGIN settle wakes generated by foulgorithm.jobs.schedule
    # stats posted for the Fri 28 Aug matchday
    - cron: "45 22 28 8 *"
    # stats posted for the Sat 29 Aug matchday
    - cron: "15 20 29 8 *"
    # stats posted for the Sun 30 Aug matchday
    - cron: "15 19 30 8 *"
    # stats posted for the Mon 31 Aug matchday
    - cron: "45 22 31 8 *"
    # stats posted for the Fri 04 Sep matchday
    - cron: "45 22 4 9 *"
    # stats posted for the Sat 05 Sep matchday
    - cron: "15 20 5 9 *"
    # stats posted for the Sun 06 Sep matchday
    - cron: "15 19 6 9 *"
    # END settle wakes
  workflow_dispatch:

concurrency:
  group: settle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Settle
        id: settle
        # Exit 1 means there was nothing new to grade, which is normal midweek.
        # Exit 2 means the source is dead, and that must fail loudly.
        run: |
          set +e
          python -m foulgorithm.jobs.settle
          code=$?
          set -e
          if [ $code -eq 2 ]; then exit 1; fi
          echo "graded=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.settle.outputs.graded == 'true'
        run: |
          git config user.name "foulgorithm-bot"
          git config user.email "foulgorithm@users.noreply.github.com"
          git config merge.ours.driver true
          git add site/public/data data/state/player_season_totals.json data/state/match_stats.json data/state/positions_seen.json data/state/magician_lineage.jsonl data/graded data/settled
          git diff --cached --quiet && exit 0
          git commit -m "Grade the round"
          git pull --rebase --autostash
          git push
