name: latency

# TEMPORARY instrument, one weekend of evidence. Measures when the league's
# season totals actually move after each game so STATS_DELAY and SETTLE_LAG
# can be set from data instead of caution. See jobs/stats_latency.py.
#
# Delete this workflow (and its crons) once the delays have been re-set.
# The crons are this weekend's matchdays, hand-written on purpose: a
# one-weekend tool does not earn a generator.
on:
  schedule:
    # Fri 28 Aug, 19:00 kickoff
    - cron: "0 19 28 8 *"
    # Sat 29 Aug, kickoffs 11:30 / 14:00 / 16:30; two runs cover the day
    - cron: "30 11 29 8 *"
    - cron: "25 16 29 8 *"
    # Sun 30 Aug, kickoffs 13:00 / 15:30
    - cron: "0 13 30 8 *"
    - cron: "0 17 30 8 *"
    # Mon 31 Aug, 19:00 kickoff
    - cron: "0 19 31 8 *"
  workflow_dispatch:

concurrency:
  group: latency
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Measure posting latency
        run: python -m foulgorithm.jobs.stats_latency

      - name: Commit the log
        run: |
          git config user.name "foulgorithm-bot"
          git config user.email "foulgorithm@users.noreply.github.com"
          git add data/state/stats_latency.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "Stats posting latency, measured"
          git pull --rebase --autostash
          git push
