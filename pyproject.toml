[project]
name = "foulgorithm"
version = "0.1.0"
description = "Probabilistic models for Premier League player disciplinary and duel markets"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "supabase>=2.5",
    "statsmodels>=0.14",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Heavier modelling dependencies. Not needed to run the pipeline.
models = [
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "optuna>=3.6",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "jupyter>=1.0",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foulgorithm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package lives in src/ and is not always installed into the venv, so
# pytest is told where to look rather than every caller having to export
# PYTHONPATH. `make test` was failing on import for exactly this reason.
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "network: test hits the network. Deselected by default in CI",
    "slow: test takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD"]
ignore = [
    "E501",    # line length is handled by the formatter
    "E741",    # a leg is `l` in comprehensions over legs, in 27 places; not ambiguous here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
